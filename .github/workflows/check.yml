name: Check manifests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-manifests.sh
      - run: shellcheck .github/scripts/*.sh plugins/fortrabbit/skills/fortrabbit/scripts/*.sh
