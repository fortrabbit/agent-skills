name: Publish skill release

on:
  push:
    branches: [main]
    paths: [VERSION]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "tag=v$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Create tag and release
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          # Build first: a failed check stops the job before anything is tagged or published.
          zip=$(.github/scripts/build-openai-zip.sh)
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes "$zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs on every VERSION push, also when the tag above exists, so a re-run retries a failed sync.
      - name: Sync the skill to fortrabbit/laravel-boost
        run: |
          key="$RUNNER_TEMP/laravel-boost-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$LARAVEL_BOOST_DEPLOY_KEY" > "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            .github/scripts/sync-laravel-boost.sh "${{ steps.ver.outputs.tag }}"
        env:
          LARAVEL_BOOST_DEPLOY_KEY: ${{ secrets.LARAVEL_BOOST_DEPLOY_KEY }}
